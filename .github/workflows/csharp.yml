name: C# port

on:
  push:
    branches: [ master, 'claude/**' ]
    paths:
      - 'MakouReactor.CSharp/**'
      - '.github/workflows/csharp.yml'
  pull_request:
    paths:
      - 'MakouReactor.CSharp/**'
      - '.github/workflows/csharp.yml'
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  SOLUTION: MakouReactor.CSharp/MakouReactor.sln

jobs:
  windows:
    name: Windows (full solution incl. WPF)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('MakouReactor.CSharp/**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore ${{ env.SOLUTION }}

      - name: Build (warnings are errors)
        run: dotnet build ${{ env.SOLUTION }} -c Release --no-restore -warnaserror

      - name: Test
        run: >
          dotnet test ${{ env.SOLUTION }} -c Release --no-build
          --logger "trx;LogFilePrefix=windows"
          --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-windows
          path: TestResults/*.trx

  linux:
    name: Linux (Core, AI, CLI)
    runs-on: ubuntu-latest
    env:
      TEST_PROJECT: MakouReactor.CSharp/tests/MakouReactor.Tests/MakouReactor.Tests.csproj
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('MakouReactor.CSharp/**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore ${{ env.TEST_PROJECT }}

      - name: Build (warnings are errors)
        run: dotnet build ${{ env.TEST_PROJECT }} -c Release --no-restore -warnaserror

      - name: Test
        run: >
          dotnet test ${{ env.TEST_PROJECT }} -c Release --no-build
          --logger "trx;LogFilePrefix=linux"
          --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-linux
          path: TestResults/*.trx
